# conda env create -f environment.yml && conda activate unipocket
name: unipocket
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.0
  - pytorch-cuda=12.1      # drop this line for a CPU-only install
  - numpy>=1.21
  - biopython>=1.79
  - tqdm>=4.60
  - pandas>=1.3
  - pytest>=7.0
  - pip
  - pip:
      - fair-esm>=2.0.0
