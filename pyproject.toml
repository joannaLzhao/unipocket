[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unipocket"
version = "0.1.0"
description = "Per-residue cryptic-pocket and ligand-binding prediction from ESM2 embeddings"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Lening Zhao", email = "lnzhao@seas.upenn.edu" }]
keywords = ["protein", "cryptic pocket", "ligand binding", "ESM2", "drug discovery"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=1.12",
    "fair-esm>=2.0.0",
    "biopython>=1.79",
    "numpy>=1.21",
    "tqdm>=4.60",
]

[project.urls]
Paper = "https://doi.org/10.1145/3807503.3819482"
Repository = "https://github.com/joannaLzhao/unipocket"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=1.3"]

[project.scripts]
unipocket = "unipocket.cli:main"

[tool.setuptools.packages.find]
include = ["unipocket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
